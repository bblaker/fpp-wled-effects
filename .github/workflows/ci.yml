name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a new FPP release that needs a pluginInfo.json update
    # (see tests/check_manifest.py) is noticed even without new commits.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The PHP each supported FPP release ships with:
        # FPP 8 (Debian bullseye) 7.4, FPP 9 (bookworm) 8.2, FPP 10 (trixie) 8.4.
        php: ['7.4', '8.2', '8.4']
    container: php:${{ matrix.php }}-cli
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: bash tests/run.sh

  fpp:
    name: FPP ${{ matrix.fpp }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Latest release of each FPP major pluginInfo.json supports.
        fpp: ['8.5.1', '9.5.3', '10.2']
    steps:
      - uses: actions/checkout@v4
      - name: Pull FPP image
        run: docker pull -q falconchristmas/fpp:${{ matrix.fpp }}
      - name: Plugin inside FPP ${{ matrix.fpp }}
        run: bash tests/fpp_integration.sh ${{ matrix.fpp }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check_manifest.py looks up pinned commits

      - name: pluginInfo.json versions cover the newest FPP
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tests/check_manifest.py

      - name: JSON files parse
        run: |
          for f in pluginInfo.json commands/descriptions.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok $f"
          done

      - name: pluginInfo.json matches FPP's plugin schema
        run: |
          pipx run check-jsonschema \
            --schemafile https://raw.githubusercontent.com/FalconChristmas/fpp-plugin-Template/master/pluginInfo.schema.json \
            pluginInfo.json

      - name: Shell scripts
        run: |
          for f in commands/*.sh scripts/*.sh tests/*.sh; do
            bash -n "$f"
            [ -x "$f" ] || { echo "$f is not executable"; exit 1; }
          done
          shellcheck -S warning commands/*.sh scripts/*.sh tests/*.sh

      - name: JavaScript syntax
        run: node --check js/fpp-wled-effects.js
